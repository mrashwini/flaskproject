<!DOCTYPE html>
<html>
<head>
 HEAD
    <title>To-Do Page</title>
    <script>
        async function submitForm(event) {
            event.preventDefault();

            const itemName = document.getElementById("itemName").value;
            const itemDescription = document.getElementById("itemDescription").value;

            const response = await fetch('/submittodoitem', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ itemName, itemDescription })
            });

            const data = await response.json();
            alert(data.message);
        }
    </script>
</head>
<body>
    <h1>To-Do Form</h1>
    <form onsubmit="submitForm(event)">
        <label for="itemName">Item Name:</label><br>
        <input type="text" id="itemName" name="itemName" required><br><br>

        <label for="itemDescription">Item Description:</label><br>
        <textarea id="itemDescription" name="itemDescription" required></textarea><br><br>

        <input type="submit" value="Submit">
    </form>

    <title>To-Do Form</title>
</head>
<body>
    <h1>Simple To-Do Form</h1>
    <form method="POST">
        <label>Item ID:</label>
        <input type="text" name="item_id" required><br><br>
        <input type="submit" value="Submit">
    </form>

    {% if item_id %}
        <p><strong>Item ID:</strong> {{ item_id }}</p>
    {% endif %}
    {% if item_uuid %}
        <p><strong>Item UUID:</strong> {{ item_uuid }}</p>
    {% endif %}
    {% if item_hash %}
        <p><strong>Item Hash:</strong> {{ item_hash }}</p>
    {% endif %}

</body>
</html>
